<!DOCTYPE html>
<html>
<head>
  <title>Avalie nosso atendimento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link href="{{url_for('static', filename='css/style.css')}}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
 
  <form action="" method="post">
  <label for="nome" class="form-label">Nome:</label><br>
      <input type="text" name="nome" class="form-control"><br>
    <label for="nota" class="form-label">De 1 a 5, como você avalia nosso atendimento:</label><br>
    <select name="nota" class="form-control">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select><br>
    <label for="comentario" class="form-label">Comentário:</label><br>
    <textarea id="comentario" name="comentario" rows="4" cols="50" class="form-control"></textarea><br>
    <input type="submit" class="button" value="Enviar" >
  </form>
</div>
</body>
</html>
